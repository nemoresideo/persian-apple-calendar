name: Validate & Update Persian Apple Calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_calendar.py"
      - "config.json"
      - "tests/**"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: write

concurrency:
  group: persian-calendar-main
  cancel-in-progress: true

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run conversion tests
        run: python -m unittest discover -s tests -v

      - name: Generate ICS feeds
        run: python generate_calendar.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("calendar.ics", "calendar-pro.ics", "calendar-full.ics"):
              p = Path(name)
              data = p.read_text(encoding="utf-8")
              assert data.startswith("BEGIN:VCALENDAR")
              assert data.rstrip().endswith("END:VCALENDAR")
              assert "SUMMARY:۱۲ مهر" in data
              print(f"{name}: {p.stat().st_size:,} bytes OK")
          PY

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics calendar-pro.ics calendar-full.ics
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Persian calendar feeds"
          git push
