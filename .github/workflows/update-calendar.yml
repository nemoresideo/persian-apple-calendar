name: Validate & Update Persian Apple Calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_calendar.py"
      - "sync_iran_calendar.py"
      - "requirements.txt"
      - "config.json"
      - "data/**"
      - "tests/**"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: write

concurrency:
  group: persian-calendar-main
  cancel-in-progress: true

jobs:
  sync-validate-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: pip install -r requirements.txt

      - name: Sync Iran holidays and occasions
        run: python sync_iran_calendar.py --start-year 1405 --end-year 1410

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate ICS feeds
        run: python generate_calendar.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = (
              "calendar.ics",
              "calendar-pro.ics",
              "calendar-full.ics",
              "iran-holidays.ics",
              "iran-events.ics",
          )
          for name in required:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f"Missing generated feed: {name}")
              data = p.read_text(encoding="utf-8")
              assert data.startswith("BEGIN:VCALENDAR")
              assert data.rstrip().endswith("END:VCALENDAR")
              print(f"{name}: {p.stat().st_size:,} bytes OK")
          PY

      - name: Commit synced data and generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iran-calendar.json
          git add calendar.ics calendar-pro.ics calendar-full.ics
          git add iran-holidays.ics iran-events.ics
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync Iran calendar data and refresh feeds"
          git push
