name: Update Persian Apple Calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_calendar.py"
      - "config.json"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ICS feeds
        run: python generate_calendar.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics calendar-full.ics
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Persian calendar feeds"
          git push
